<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowRoute" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#routeGrad)"/>
  <!-- Traza náutica / ruta con puntos de partida y llegada -->
  <path d="M18 46 C 24 30, 40 38, 46 18" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 3" stroke-linecap="round" filter="url(#glowRoute)"/>
  <!-- Punto Origen -->
  <circle cx="18" cy="46" r="4.5" fill="#ffffff"/>
  <circle cx="18" cy="46" r="2" fill="#047857"/>
  <!-- Punto Destino (GPS Pin) -->
  <path d="M46 14 C43.5 14, 41.5 16, 41.5 18.5 C41.5 22, 46 27, 46 27 C46 27, 50.5 22, 50.5 18.5 C50.5 16, 48.5 14, 46 14 Z" fill="#ffffff"/>
  <circle cx="46" cy="18.5" r="1.8" fill="#0284c7"/>
  <!-- Olas marinas de fondo -->
  <path d="M12 54 C 18 52, 22 56, 28 54 C 34 52, 38 56, 44 54 C 48 52, 50 54, 52 54" fill="none" stroke="#d1fae5" stroke-width="2" stroke-linecap="round"/>
</svg>
